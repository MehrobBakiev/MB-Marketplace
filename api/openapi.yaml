openapi: 3.0.3
info:
  title: Marketplace API — ДЗ №2
  version: 1.0.0
  description: 'Контракт является источником DTO, маршрутов и валидации. Деньги: JSON
    number, decimal с точностью 2 знака. Все ошибки имеют error_code, message и необязательные
    details.'
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      tags:
      - System
      summary: Готовность приложения и доступность БД
      security: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '503':
          description: База данных недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
  /products:
    get:
      operationId: listProducts
      tags:
      - Products
      summary: Список товаров
      description: USER, SELLER, ADMIN. Точное совпадение category; без status возвращаются
        все статусы, включая ARCHIVED. Стабильная сортировка по id.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
    post:
      operationId: createProduct
      tags:
      - Products
      summary: Создать товар
      description: SELLER создаёт только свои товары; ADMIN может указать seller_id
        существующего SELLER или ADMIN.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
  /products/{id}:
    get:
      operationId: getProduct
      tags:
      - Products
      summary: Получить товар
      description: USER, SELLER, ADMIN.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      operationId: updateProduct
      tags:
      - Products
      summary: Обновить товар целиком
      description: SELLER — только свои товары; ADMIN — любые. seller_id неизменяем.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters:
      - *id001
    delete:
      operationId: archiveProduct
      tags:
      - Products
      summary: Архивировать товар
      description: 'SELLER — только свои товары; ADMIN — любые. Мягкое удаление: status
        = ARCHIVED. Повторный DELETE идемпотентен.'
      responses:
        '204':
          description: Операция выполнена
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id001
  /orders:
    post:
      operationId: createOrder
      tags:
      - Orders
      summary: Создать заказ
      description: 'USER, ADMIN. Проверки: лимит частоты → активный заказ → товары
        → остатки → промокод. Повторяющиеся product_id отклоняются. Резерв, snapshot
        цен, скидка и user_operations атомарны.'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      operationId: getOrder
      tags:
      - Orders
      summary: Получить заказ
      description: USER — свой заказ; ADMIN — любой; SELLER запрещено.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id001
    put:
      operationId: updateOrder
      tags:
      - Orders
      summary: Заменить позиции заказа
      description: USER — свой заказ; ADMIN — любой. Только CREATED. Старые остатки
        возвращаются, новые резервируются в одной транзакции. Новые позиции получают
        текущую цену. Промокод перепроверяется; если он неприменим, скидка снимается
        и использование возвращается.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters:
      - *id001
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags:
      - Orders
      summary: Отменить заказ
      description: USER — свой заказ; ADMIN — любой. Только CREATED или PAYMENT_PENDING.
        В одной транзакции возвращаются остатки и использование промокода; статус
        CANCELED.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id001
  /orders/{id}/status:
    post:
      operationId: transitionOrder
      tags:
      - Orders
      summary: Перевести заказ в следующий статус
      description: Только ADMIN. CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED.
        Для отмены используется /cancel.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - *id001
  /promo-codes:
    post:
      operationId: createPromoCode
      tags:
      - Promo codes
      summary: Создать промокод
      description: SELLER, ADMIN. valid_until >= valid_from. Процентная скидка ограничена
        70% суммы; фиксированная скидка не превышает сумму. Код уникален.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
  /auth/register:
    post:
      operationId: register
      tags:
      - Auth
      summary: Регистрация
      description: Публичный метод. Разрешены роли USER и SELLER; ADMIN создаётся
        при запуске из окружения.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Вход
      description: Публичный метод. Выдаёт access JWT (20 минут) и refresh JWT (14
        дней).
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      operationId: refresh
      tags:
      - Auth
      summary: Обновить токены
      description: 'Публичный метод. Refresh token одноразовый: ротация и отзыв предыдущего
        токена в одной транзакции.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-Request-Id:
              description: UUID запроса, генерируется сервером
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT с claims sub (user ID), role, token_type=access, exp,
        iat, jti.
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    Money:
      type: number
      format: decimal
      minimum: 0
      maximum: 9999999999.99
      multipleOf: 0.01
      x-go-type: decimal.Decimal
      x-go-type-import:
        name: decimal
        path: github.com/shopspring/decimal
    ProductCreate:
      type: object
      additionalProperties: false
      required: &id002
      - name
      - price
      - stock
      - category
      - status
      properties:
        name: &id003
          type: string
          minLength: 1
          maxLength: 255
        description: &id004
          type: string
          maxLength: 4000
          nullable: true
        price: &id005
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            name: decimal
            path: github.com/shopspring/decimal
        stock: &id006
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        category: &id007
          type: string
          minLength: 1
          maxLength: 100
        status: &id008
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          minimum: 1
          description: Только ADMIN может указать владельца; без поля товар принадлежит
            текущему пользователю.
    ProductUpdate:
      type: object
      additionalProperties: false
      required: *id002
      properties:
        name: *id003
        description: *id004
        price: *id005
        stock: *id006
        category: *id007
        status: *id008
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name: *id003
        description: *id004
        price: *id005
        stock: *id006
        category: *id007
        status: *id008
        seller_id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - totalElements
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
    OrderItemInput:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 999
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items: &id009
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemInput'
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
          nullable: true
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items: *id009
    OrderItemResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int64
          minimum: 1
        price_at_order:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            name: decimal
            path: github.com/shopspring/decimal
    OrderResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - status
      - promo_code_id
      - total_amount
      - discount_amount
      - items
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code_id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
        total_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    PromoCodeCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      properties:
        code: &id010
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type: &id011
          $ref: '#/components/schemas/DiscountType'
        discount_value: &id012
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            name: decimal
            path: github.com/shopspring/decimal
        min_order_amount: &id013
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            name: decimal
            path: github.com/shopspring/decimal
        max_uses: &id014
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
        valid_from: &id015
          type: string
          format: date-time
        valid_until: &id016
          type: string
          format: date-time
        active: &id017
          type: boolean
          default: true
    PromoCodeResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      - current_uses
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        code: *id010
        discount_type: *id011
        discount_value: *id012
        min_order_amount: *id013
        max_uses: *id014
        valid_from: *id015
        valid_until: *id016
        active: *id017
        current_uses:
          type: integer
          format: int64
          minimum: 0
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: 'Не более 72 байт UTF-8: ограничение bcrypt.'
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: 'Не более 72 байт UTF-8: ограничение bcrypt.'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
    AuthResponse:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
        user:
          $ref: '#/components/schemas/UserResponse'
    ErrorCode:
      type: string
      enum:
      - PRODUCT_NOT_FOUND
      - PRODUCT_INACTIVE
      - ORDER_NOT_FOUND
      - ORDER_LIMIT_EXCEEDED
      - ORDER_HAS_ACTIVE
      - INVALID_STATE_TRANSITION
      - INSUFFICIENT_STOCK
      - PROMO_CODE_INVALID
      - PROMO_CODE_MIN_AMOUNT
      - ORDER_OWNERSHIP_VIOLATION
      - VALIDATION_ERROR
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - REFRESH_TOKEN_INVALID
      - ACCESS_DENIED
      - INVALID_CREDENTIALS
      - USER_ALREADY_EXISTS
      - PROMO_CODE_ALREADY_EXISTS
      - RESOURCE_NOT_FOUND
      - INTERNAL_ERROR
      description: 'Каталог кодов и HTTP-статусов:

        400: VALIDATION_ERROR.

        401: TOKEN_EXPIRED, TOKEN_INVALID, REFRESH_TOKEN_INVALID, INVALID_CREDENTIALS.

        403: ACCESS_DENIED, ORDER_OWNERSHIP_VIOLATION.

        404: PRODUCT_NOT_FOUND, ORDER_NOT_FOUND, RESOURCE_NOT_FOUND.

        409: PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION, INSUFFICIENT_STOCK,
        USER_ALREADY_EXISTS, PROMO_CODE_ALREADY_EXISTS.

        422: PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT.

        429: ORDER_LIMIT_EXCEEDED.

        500 (503 для health): INTERNAL_ERROR.'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
  responses:
    BadRequest:
      description: 'VALIDATION_ERROR: некорректный JSON, параметры или нарушение ограничений
        контракта.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    Unauthorized:
      description: TOKEN_INVALID, TOKEN_EXPIRED, REFRESH_TOKEN_INVALID или INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    Forbidden:
      description: 'ACCESS_DENIED: недостаточно прав; ORDER_OWNERSHIP_VIOLATION: чужой
        заказ.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    NotFound:
      description: PRODUCT_NOT_FOUND, ORDER_NOT_FOUND или RESOURCE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    Conflict:
      description: 'PRODUCT_INACTIVE, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION,
        INSUFFICIENT_STOCK или USER_ALREADY_EXISTS. PROMO_CODE_ALREADY_EXISTS: код
        уже существует.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    Unprocessable:
      description: 'PROMO_CODE_INVALID: отсутствует, истёк, неактивен или исчерпан;
        PROMO_CODE_MIN_AMOUNT: сумма ниже минимальной.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    TooManyRequests:
      description: 'ORDER_LIMIT_EXCEEDED: интервал создания/обновления заказа ещё
        не прошёл.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
    InternalError:
      description: 'INTERNAL_ERROR: внутренняя ошибка сервера.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Request-Id:
          schema:
            type: string
            format: uuid
          description: UUID запроса
